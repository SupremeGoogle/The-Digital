    (function () {
      const tl = gsap.timeline({ paused: true });
      const D = "#c-didi-svg ";
      const slap = (sel, t, rot, from = 1.5) =>

      const w2 = gsap.utils.toArray("#c-intro-2 .w");

      tl.fromTo(w2.slice(4), { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.28, ease: "power2.out", stagger: 0.18 }, 2.68);
      tl.to("#c-intro-2", { opacity: 0, filter: "blur(12px)", duration: 0.3, ease: "power2.in" }, 5.05);

      // The first notes drift in from the edges and sway while the line is read.
      const edge = [[-300, -120], [300, -120], [260, 200], [-260, 200], [80, -300], [-320, 0], [320, 0], [-60, -300], [60, 300], [-60, 300]];
      const rots = [-8, 7, -5, 9, -3, 6, -7, 4, -10, 8];
      for (let i = 1; i <= 10; i++) {
        const [dx, dy] = edge[i - 1], r = rots[i - 1];
        tl.fromTo(`#c-s${i}`, { opacity: 0, x: dx, y: dy, rotation: r - 12 },
          { opacity: 1, x: 0, y: 0, rotation: r, duration: 2.4, ease: "power2.out" }, 2.2 + i * 0.22);
        tl.to(`#c-s${i}`, { keyframes: { rotation: [r + 3, r - 2, r] }, duration: 2.6, ease: "sine.inOut" }, 4.9 + (i % 3) * 0.1);
      }

      // --- Chaos: flyers cross the frame on arcs, one after another. ---
      gsap.utils.toArray("#c-stage .fly").forEach((el, i) => {
        const fromLeft = i % 2 === 0;
        const y0 = 120 + ((i * 173) % 820), y1 = 120 + ((i * 311 + 260) % 820);
        const x0 = fromLeft ? -300 : 2220, x1 = fromLeft ? 2220 : -300;
        const lift = -160 - (i % 4) * 70, t = 5.2 + i * 0.47, d = 1.5 + (i % 3) * 0.3;
        const r0 = (i % 2 ? 1 : -1) * (20 + i * 3);
        gsap.set(el, { x: x0, y: y0, rotation: r0 });
        tl.fromTo(el, { x: x0, y: y0 }, { keyframes: { x: [x0, (x0 + x1) / 2, x1], y: [y0, (y0 + y1) / 2 + lift, y1] }, duration: d, ease: "none" }, t);
        tl.fromTo(el, { rotation: r0, scale: 0.85 + (i % 3) * 0.1 }, { rotation: r0 + (fromLeft ? 220 : -220), duration: d, ease: "none" }, t);
      });

      slap("#c-sA", 5.58, -4);
      tl.fromTo("#c-stamp", { opacity: 0, scale: 2.4, rotation: -24 },
        { opacity: 1, scale: 1, rotation: -12, duration: 0.18, ease: "power4.out" }, 5.84);
      slap("#c-sB", 6.38, 6);
      slap("#c-sC", 7.22, -10);
      slap("#c-sD", 8.26, 8);

      tl.fromTo("#c-stage", { x: 0 }, { keyframes: { x: [0, -10, 9, -6, 3, 0] }, duration: 0.3, ease: "none" }, 9.2);
      // The pile jolts with every slap.

        tl.to("#c-stage", { keyframes: { scale: [1, 1.015, 1] }, duration: 0.25, ease: "none", transformOrigin: "50% 55%" }, t));

      // "Знакомься…": the pile trembles, then Didi bursts out of it.
      tl.to(["#c-sE", "#c-sC", "#c-s9", "#c-s10"], { keyframes: [
        { rotation: "+=3", duration: 0.07 }, { rotation: "-=6", duration: 0.08 },
        { rotation: "+=5", duration: 0.08 }, { rotation: "-=2", duration: 0.07 }], ease: "none" }, 10.75);
      tl.to("#c-sE", { x: -1300, y: -1000, rotation: -70, duration: 0.5, ease: "power2.in" }, 11.05);
      tl.to("#c-sC", { x: -260, y: 60, rotation: -30, duration: 0.4, ease: "power3.out" }, 11.08);
      tl.to("#c-s9", { x: 300, y: 80, rotation: 28, duration: 0.4, ease: "power3.out" }, 11.1);

      tl.fromTo("#c-didi", { y: 560, scaleX: 0.86, scaleY: 1.2, transformOrigin: "50% 100%" },
        { y: 0, scaleX: 0.92, scaleY: 1.1, duration: 0.3, ease: "power3.out" }, 11.06);
      tl.to("#c-didi", { scaleX: 1.12, scaleY: 0.86, duration: 0.1, ease: "power2.out" }, 11.36);
      tl.to("#c-didi", { scaleX: 1, scaleY: 1, duration: 0.35, ease: "back.out(2.5)" }, 11.46);
      tl.fromTo(D + ".pal-antenna", { rotation: 0, svgOrigin: "50 16" }, { keyframes: { rotation: [14, -10, 5, 0] }, duration: 0.6, ease: "none" }, 11.36);
      tl.fromTo(D + ".pal-arm-right", { rotation: 0, svgOrigin: "86 62" }, { rotation: -150, duration: 0.16, ease: "power3.out" }, 11.55);
      tl.to(D + ".pal-arm-right", { keyframes: { rotation: [-118, -152, -120, -150] }, duration: 0.56, ease: "sine.inOut" }, 11.71);
      tl.to(D + ".pal-arm-right", { rotation: 0, duration: 0.22, ease: "power2.inOut" }, 12.27);

      tl.to(D + ".pal-head", { rotation: 0, duration: 0.3, ease: "power2.inOut" }, 12.2);
      tl.fromTo(D + ".pal-eyes", { scaleY: 1, svgOrigin: "50 40" }, { keyframes: { scaleY: [0.1, 1] }, duration: 0.14, ease: "none" }, 12.05);
