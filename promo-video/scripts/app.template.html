      <path d="M4 2.5v17.2l4.6-4.3 2.9 6.6 3.2-1.4-2.9-6.5h6.3L4 2.5Z" fill="#fff" stroke="#14213d" stroke-width="1.5" stroke-linejoin="round" />

  <script>
    (function () {
      // Element boxes, measured by scripts/measure-ui.mjs.
      const R = /*RECTS*/{}/*/RECTS*/;
      const T0 = 14.0; // film time at which this scene starts
      const at = (t) => t - T0;
      const tl = gsap.timeline({ paused: true });
      const c = (r) => ({ x: r.x + r.w / 2, y: r.y + r.h / 2 });

      // Camera: a page point lands in the centre of the frame at scale s.
      const cam = (px, py, s) => ({ x: 960 - px * s, y: 540 - py * s, scale: s });
      const move = (t, dur, px, py, s, ease = "power2.inOut") => tl.to("#a-cam", { ...cam(px, py, s), duration: dur, ease }, at(t));
      const whip = (t, dur, px, py, s, blur = 6) => {
        move(t, dur, px, py, s, "power3.inOut");
        tl.fromTo("#a-cam", { filter: "blur(0px)" }, { keyframes: { filter: [`blur(${blur}px)`, "blur(0px)"] }, duration: dur, ease: "none", immediateRender: false }, at(t));
      };
      // Page-space cursor, scaled so it stays ~64 px on screen.
      const cursor = (t, dur, px, py, s, ease = "power3.out") => tl.to("#a-cursor", { x: px - 6, y: py - 3, scale: 1.6 / s, duration: dur, ease }, at(t));
      const click = (t, sel = "#a-cursor") => tl.to(sel, { keyframes: { scale: ["*=0.82", "/=0.82"] }, duration: 0.16, ease: "none" }, at(t));
      const show = (sel, t, d = 0.06) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d, ease: "none", immediateRender: false }, at(t));
      const hide = (sel, t, d = 0.06) => tl.to(sel, { opacity: 0, duration: d, ease: "none" }, at(t));
      const swap = (from, to, t, d = 0.06) => { show(to, t, d); hide(from, t, d); };

      const input = R.input, slot = R.cardH + R.gap, ic = c(input);
      gsap.set("#a-cam", { transformOrigin: "0 0", ...cam(ic.x, ic.y, 1.85) });
      gsap.set("#a-cursor", { transformOrigin: "6px 3px", x: 2400, y: ic.y, scale: 1.6 / 1.85 });
      gsap.set("#a-cursor2", { transformOrigin: "6px 3px", x: 2300, y: 700, scale: 1.6, opacity: 0 });
      gsap.set("#calendar", { x: R.board.x - R.calOrigin.x, y: R.board.y - R.calOrigin.y, width: R.board.w });

      // --- 14.0 The field Didi spat out becomes the site around it. ---
      tl.fromTo("#a-cam", { opacity: 0, filter: "blur(12px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, at(14.02));

      // --- 14.2 Smart input: type, then the parser names what it understood. ---
      document.querySelectorAll("#a-typed, #a-ph").forEach((el) => { el.style.font = R.inputFont; el.style.lineHeight = `${R.inputLine}px`; });
      gsap.set("#a-typed, #a-ph", { x: input.x + R.inputPad, y: input.y + (input.h - R.inputLine) / 2 });
      hide("#a-ph", 14.2, 0.01);
      gsap.utils.toArray("#a-typed .ch").forEach((ch, i) => show(ch, 14.22 + i * 0.04, 0.01));
      show("#a-pv-label", 15.6, 0.12);
      [["#a-pv-tag", 15.7], ["#a-pv-prio", 16.3], ["#a-pv-due", 17.05]].forEach(([s, t]) =>
        tl.fromTo(s, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, at(t)));

      // --- 17.6 Add: the line leaves the field as a card and lands on the board. ---
      const add = c(R.add);
      move(17.1, 0.45, add.x - 330, ic.y + 40, 1.6);
      tl.set("#a-cursor", { x: add.x + 700, y: add.y + 140, scale: 1.0 }, at(17.05));
      cursor(17.1, 0.42, add.x + 10, add.y + 6, 1.6);
      click(17.55);
      tl.to(".composer .btn-primary", { keyframes: { scale: [0.95, 1] }, duration: 0.18, ease: "none" }, at(17.55));
      hide("#a-typed", 17.6, 0.1);
      hide(["#a-pv-label", "#a-pv-tag", "#a-pv-prio", "#a-pv-due"], 17.6, 0.12);
      show("#a-ph", 17.7, 0.1);
      // The site's own numbers follow the new task: 8 of 19, 42 %.
      swap("#a-all-18", "#a-all-19", 17.75); swap("#a-pct-44", "#a-pct-42", 17.75);
      swap("#a-note-818", "#a-note-819", 17.75); swap("#a-sub-10", "#a-sub-11", 17.75);
      tl.fromTo("#progressBar", { scaleX: 1, transformOrigin: "0 50%" }, { scaleX: 42 / 44, duration: 0.3, ease: "power2.out" }, at(17.75));

      const todo = R.todoFirst, doing = R.doingFirst, done = R.doneFirst;
      const cx = (r) => r.x - R.cardOrigin.x, cy = (r) => r.y - R.cardOrigin.y;
      gsap.set("#a-card", { width: todo.w, height: todo.h });
      gsap.set("#a-card .card-item", { opacity: 0 });
      tl.fromTo("#a-card", { x: input.x + 20 - R.cardOrigin.x, y: input.y - R.cardOrigin.y, scale: 0.7, transformOrigin: "0 0" },
        { x: cx(todo), y: cy(todo), scale: 1, duration: 0.75, ease: "power3.inOut" }, at(17.62));
      show("#a-v-todo", 17.62, 0.12);
      move(17.65, 0.75, c(todo).x + 40, todo.y + 210, 1.6);
      cursor(17.65, 0.75, c(todo).x + 120, todo.y + 360, 1.6, "power2.inOut");
      tl.to(".col-list[data-status=todo] > li", { y: slot, duration: 0.4, ease: "power3.out" }, at(17.95));
      swap("#a-todo-6", "#a-todo-7", 18.25);
      tl.fromTo("#a-v-todo", { outlineColor: "rgba(40,100,223,0)" }, { outlineColor: "rgba(40,100,223,.42)", duration: 0.12, ease: "none" }, at(18.38));
      tl.to("#a-v-todo", { outlineColor: "rgba(40,100,223,0)", duration: 0.5, ease: "none" }, at(19.2));

      // --- 19.5 «…и в календаре»: click Календарь, the month opens on 3 November. ---
      const vc = c(R.viewCal), cell = { x: R.board.x + R.cell3.x + R.cell3.w / 2, y: R.board.y + R.cell3.y + R.cell3.h / 2 };
      move(19.45, 0.5, vc.x - 380, vc.y + 200, 1.45);
      cursor(19.6, 0.5, vc.x, vc.y + 4, 1.45);
      click(20.18);
      swap("#a-vs-board", "#a-vs-cal", 20.22, 0.05);
      tl.to("#board", { opacity: 0, duration: 0.2, ease: "power1.out" }, at(20.22));
      tl.to(".insights, .hint", { opacity: 0, duration: 0.2, ease: "none" }, at(20.22));
      tl.fromTo("#calendar", { opacity: 0, y: R.board.y - R.calOrigin.y + 24 }, { opacity: 1, y: R.board.y - R.calOrigin.y, duration: 0.35, ease: "power3.out", immediateRender: false }, at(20.25));
      hide("#a-card", 20.22, 0.15);
      move(20.4, 0.6, cell.x + 260, cell.y - 70, 1.6);
      tl.to("#a-cursor", { x: cell.x + 60, y: cell.y + 70, scale: 1.0, duration: 0.6, ease: "power2.inOut" }, at(20.4));

      // --- 21.6 «…не забыть»: Ещё → Telegram-напоминания. ---
      const more = c(R.more), trig = c(R.tgTrigger);
      move(21.45, 0.45, more.x - 300, more.y + 130, 1.6);
      cursor(21.5, 0.4, more.x, more.y + 4, 1.6);
      click(21.92);
      tl.fromTo("#a-menu", { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.18, ease: "power3.out" }, at(21.96));
      cursor(22.02, 0.25, trig.x - 20, trig.y + 2, 1.6);
      click(22.3);
      // The modal: screen space, enlarged for reading, anchored at the top centre.
      const S = 1.5, top1 = 60, dlg = R.tg;
      const scr = (r, sy) => ({ x: 960 + (r.x + r.w / 2 - dlg.w / 2) * S, y: sy + (r.y + r.h / 2) * S });
      gsap.set("#a-tg", { left: 960 - dlg.w / 2, top: 0, transformOrigin: "50% 0" });
      tl.fromTo("#a-tg-back", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, at(22.34));
      tl.fromTo("#a-tg", { opacity: 0, y: top1 + 20, scale: S * 0.96 }, { opacity: 1, y: top1, scale: S, duration: 0.32, ease: "expo.out" }, at(22.34));
      hide("#a-menu", 22.34, 0.1);
      tl.to("#a-cursor", { opacity: 0, duration: 0.1, ease: "none" }, at(22.34));
      const chk = scr(R.tgCheck, top1);
      tl.fromTo("#a-cursor2", { x: chk.x + 300, y: chk.y + 260, opacity: 0 }, { x: chk.x - 4, y: chk.y - 2, opacity: 1, duration: 0.4, ease: "power3.out" }, at(22.42));
      click(22.85, "#a-cursor2");
      swap("#a-tg-rowA", "#a-tg-rowB", 22.88, 0.05);
      // Down to «Сохранить», click, back up to the confirmation.
      const top2 = 1010 - (R.tgSave.y + R.tgSave.h) * S, save = scr(R.tgSave, top2);
      tl.to("#a-tg", { y: top2, duration: 0.45, ease: "power2.inOut" }, at(23.0));
      tl.to("#a-cursor2", { x: save.x, y: save.y, duration: 0.45, ease: "power2.inOut" }, at(23.0));
      click(23.5, "#a-cursor2");
      tl.to("#a-tg .telegram-save", { keyframes: { scale: [0.95, 1] }, duration: 0.18, ease: "none" }, at(23.5));
      swap("#a-tg-st1", "#a-tg-st2", 23.6, 0.1);
      tl.to("#a-tg", { y: top1, duration: 0.4, ease: "power2.inOut" }, at(23.62));
      tl.to("#a-cursor2", { opacity: 0, duration: 0.15, ease: "none" }, at(23.62));
      // The reminder as it will arrive: the bot's own text.
      tl.fromTo("#a-push", { opacity: 0, y: -160 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, at(24.1));
      tl.to("#a-push", { opacity: 0, y: -160, duration: 0.3, ease: "power2.in" }, at(25.25));

      // Under the closing modal the view goes back to the board, ready for the drag.
      const pair = (c(todo).x + c(doing).x) / 2;
      swap("#a-vs-cal", "#a-vs-board", 24.85, 0.01);
      tl.set("#calendar", { opacity: 0 }, at(24.85));
      tl.set(["#board", ".insights", ".hint", "#a-card"], { opacity: 1 }, at(24.85));
      tl.set("#a-cam", cam(pair, todo.y + 200, 1.45), at(24.86));
      tl.set("#a-cursor", { x: todo.x + todo.w * 0.55 + 160, y: todo.y + todo.h * 0.45 + 200, scale: 1.6 / 1.45, opacity: 0 }, at(24.86));
      tl.to("#a-tg", { opacity: 0, scale: S * 0.96, duration: 0.22, ease: "power2.in" }, at(24.9));
      tl.to("#a-tg-back", { opacity: 0, duration: 0.3, ease: "power1.in" }, at(24.95));

      // --- 25.4 Drag: grab on «Перетащил», drop on «в работе». ---
      tl.to("#a-cursor", { opacity: 1, duration: 0.1, ease: "none" }, at(25.1));
      cursor(25.1, 0.32, todo.x + todo.w * 0.55, todo.y + todo.h * 0.45, 1.45);
      click(25.45);
      tl.to("#a-card", { scale: 1.035, rotation: -2, duration: 0.15, ease: "power2.out", transformOrigin: "50% 50%" }, at(25.47));
      tl.to("#a-card", { x: cx(doing), y: cy(doing), duration: 0.8, ease: "power2.inOut" }, at(25.55));
      tl.to("#a-cursor", { x: `+=${doing.x - todo.x}`, y: `+=${doing.y - todo.y}`, duration: 0.8, ease: "power2.inOut" }, at(25.55));
      tl.to("#a-card", { scale: 1, rotation: 0, duration: 0.25, ease: "back.out(2)" }, at(26.35));
      tl.to(".col-list[data-status=todo] > li", { y: 0, duration: 0.4, ease: "power3.out" }, at(25.65));
      tl.to(".col-list[data-status=doing] > li", { y: slot, duration: 0.4, ease: "power3.out" }, at(25.95));
      swap("#a-todo-7", "#a-todo-6", 25.7);
      swap("#a-doing-4", "#a-doing-5", 26.37); swap("#a-kd-4", "#a-kd-5", 26.37);
      swap("#a-v-todo", "#a-v-doing", 26.35, 0.08);

      // --- 27.3 Done: push in on the checkbox, tick, the site's confetti. ---
      const box = { x: doing.x + R.boxOff.x + R.boxOff.w / 2, y: doing.y + R.boxOff.y + R.boxOff.h / 2 };
      move(26.55, 0.5, box.x + 170, box.y + 30, 1.9);
      cursor(26.8, 0.45, box.x + 2, box.y + 2, 1.9);
      click(27.3);
      swap("#a-v-doing", "#a-v-checked", 27.33, 0.04);
      tl.fromTo("#a-v-checked .box", { scale: 0.75 }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, at(27.33));
      tl.fromTo("#a-v-checked .box svg", { strokeDashoffset: 24 }, { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" }, at(27.37));
      gsap.utils.toArray("#a-confetti i").forEach((p, i) => {
        const a = (i / 14) * Math.PI * 2 + 0.3, r = 34 + (i % 4) * 9;
        const dx = Math.cos(a) * r, dy = Math.sin(a) * r - 18, t = at(27.35 + (i % 3) * 0.018);
        gsap.set(p, { x: box.x, y: box.y, opacity: 0, scale: 0.5 });
        tl.to(p, { opacity: 1, x: box.x + dx * 0.55, y: box.y + dy * 0.55, scale: 0.9, rotation: i * 25, duration: 0.12, ease: "power2.out" }, t);
        tl.to(p, { x: box.x + dx, y: box.y + dy, scale: 1, rotation: i * 53 + 80, duration: 0.24, ease: "power1.out" }, t + 0.12);
        tl.to(p, { opacity: 0, y: box.y + dy + 40, scale: 0.65, rotation: i * 53 + 140, duration: 0.3, ease: "power1.in" }, t + 0.36);
      });
      swap("#a-done-2", "#a-done-3", 27.4);
      const pair2 = (c(doing).x + c(done).x) / 2;
      move(27.8, 0.55, pair2, doing.y + 200, 1.45);
      tl.to("#a-cursor", { x: "+=260", y: "+=420", opacity: 0, duration: 0.4, ease: "power2.in" }, at(27.75));
