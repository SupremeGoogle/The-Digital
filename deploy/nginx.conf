server {
    listen 80;
    server_name digital-todo.186-246-27-151.sslip.io;
    location ^~ /.well-known/acme-challenge/ { root /var/www/digital-todo-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name digital-todo.186-246-27-151.sslip.io;
    ssl_certificate /etc/letsencrypt/live/digital-todo.186-246-27-151.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/digital-todo.186-246-27-151.sslip.io/privkey.pem;
    root /opt/digital-todo/current;
    client_max_body_size 48k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = / { try_files /index.html =404; add_header Cache-Control no-cache; }
    location = /index.html { add_header Cache-Control no-cache; }
    location = /favicon.svg { }
    location ~ ^/(css|js)/[a-zA-Z0-9_.-]+\.(css|js)$ { add_header Cache-Control no-cache; }

    location = /health { proxy_pass http://127.0.0.1:8787; }
    location = /api/assistant {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 25s;
        proxy_connect_timeout 5s;
    }
    location /api/telegram/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
    # Only public application assets above are served, never server code or Git.
    location / { return 404; }
}
